aid: fleetline
name: Fleetline
description: Fleetline is an all-in-one AI dispatch and fleet-optimization platform for trucking
  fleets. Its AI-based dispatch engine ingests load, driver, and ELD data, simulates billions of
  scenarios, and recommends the best assignment plan so operators maximize revenue, productivity,
  and fleet utilization. The platform aggregates major load boards into a unified workspace,
  identifies schedule gaps and fills them with spot loads, composes complex trips with tradeoff
  analysis, forecasts delays, breakdowns, and HOS violations, and includes an AI assistant trained
  on fleet history and TMS data. Fleetline is a Bloomberg Beta portfolio company; it exposes a
  marketing site, a customer login/auth portal, and an internal API host, but publishes no public
  developer API, documentation, or SDKs at this time.
